name: Build Vypex-Cr_ck interface
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vypex-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate interface assets
        run: |
          test -s index.html
          test -s assets/app.css
          test -s assets/app.js
          node --check assets/app.js
          grep -q 'Vypex-Cr_ck' index.html
          grep -q '#9b6cff' assets/app.css
      - name: Package interface
        run: |
          mkdir -p dist/vypex-cr-ck
          cp index.html dist/vypex-cr-ck/
          cp -r assets dist/vypex-cr-ck/
          cp README.md dist/vypex-cr-ck/
          cd dist
          zip -qr Vypex-Cr_ck-Interface.zip vypex-cr-ck
      - uses: actions/upload-artifact@v4
        with:
          name: Vypex-Cr_ck-Interface
          path: dist/Vypex-Cr_ck-Interface.zip
          if-no-files-found: error
          retention-days: 30
