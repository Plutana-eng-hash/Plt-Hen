name: Build Vypex-Cr_ck native
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vypex-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and run core tests
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -Iinclude src/core.cpp tests/core_tests.cpp -o core-tests
          ./core-tests

  ps4-elf:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenOrbis PS4 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm make cmake python3 git curl zip
          git clone --depth 1 https://github.com/OpenOrbis/PS4-Toolchain.git "$RUNNER_TEMP/PS4-Toolchain"
          cd "$RUNNER_TEMP/PS4-Toolchain"
          chmod +x toolchain.sh
          ./toolchain.sh -i
      - name: Compile native PS4 ELF
        shell: bash
        run: |
          set -euo pipefail
          TOOLCHAIN="$RUNNER_TEMP/PS4-Toolchain"
          export OO_PS4_TOOLCHAIN="$TOOLCHAIN"
          export PATH="$TOOLCHAIN/bin:$PATH"
          mkdir -p build
          orbis-clang++ -std=c++17 -O2 -Wall -Wextra -Werror -Iinclude \
            src/main.cpp src/core.cpp -o build/Vypex-Cr_ck.elf
          file build/Vypex-Cr_ck.elf
          llvm-readelf -h build/Vypex-Cr_ck.elf
      - name: Upload PS4 ELF
        uses: actions/upload-artifact@v4
        with:
          name: Vypex-Cr_ck-PS4-ELF
          path: build/Vypex-Cr_ck.elf
          if-no-files-found: error
          retention-days: 30
