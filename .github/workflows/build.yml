name: Build Vypex-Cr_ck native
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vypex-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and run core tests
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -Iinclude src/core.cpp tests/core_tests.cpp -o core-tests
          ./core-tests

  ps4-elf:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build utilities
        run: sudo apt-get update && sudo apt-get install -y curl tar file binutils clang lld llvm
      - name: Download and locate OpenOrbis toolchain
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/openorbis"
          mkdir -p "$root"
          curl --fail --location --retry 3 --retry-delay 2 \
            https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz \
            -o "$RUNNER_TEMP/openorbis-toolchain.tar.gz"
          tar -xzf "$RUNNER_TEMP/openorbis-toolchain.tar.gz" -C "$root"

          sdk=""
          while IFS= read -r linker_script; do
            candidate="$(dirname "$linker_script")"
            if [[ -f "$candidate/lib/crt1.o" && -d "$candidate/include" ]]; then
              sdk="$candidate"
              break
            fi
          done < <(find "$root" -type f -name link.x -print)

          if [[ -z "$sdk" ]]; then
            echo "OpenOrbis archive extracted, but no SDK root containing link.x, include/, and lib/crt1.o was found." >&2
            find "$root" -maxdepth 5 -type f | head -200
            exit 1
          fi

          echo "OO_PS4_TOOLCHAIN=$sdk" >> "$GITHUB_ENV"
          echo "SDK root: $sdk"
          clang++ --version
          ld.lld --version
      - name: Compile native PS4 ELF
        run: bash scripts/build-ps4.sh build
      - name: Verify target ELF
        run: |
          file build/Vypex-Cr_ck.elf
          readelf -h build/Vypex-Cr_ck.elf
      - name: Upload PS4 ELF
        uses: actions/upload-artifact@v4
        with:
          name: Vypex-Cr_ck-PS4-ELF
          path: build/Vypex-Cr_ck.elf
          if-no-files-found: error
          retention-days: 30
