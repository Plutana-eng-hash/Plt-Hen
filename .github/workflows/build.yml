name: Build Vypex-Cr_ck native
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vypex-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and run core tests
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -Iinclude src/core.cpp tests/core_tests.cpp -o core-tests
          ./core-tests

  ps4-elf:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Download latest OpenOrbis toolchain release
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request, zipfile, io
          api = "https://api.github.com/repos/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/latest"
          request = urllib.request.Request(api, headers={"Accept": "application/vnd.github+json", "User-Agent": "Vypex-Cr_ck-CI"})
          with urllib.request.urlopen(request, timeout=60) as response:
              release = json.load(response)
          assets = [a for a in release.get("assets", []) if a["name"].lower().endswith(".zip")]
          assets = [a for a in assets if "source" not in a["name"].lower() and "windows" not in a["name"].lower() and "mac" not in a["name"].lower()]
          if not assets:
              raise SystemExit("No Linux-compatible OpenOrbis toolchain ZIP was attached to the latest release.")
          asset = next((a for a in assets if "linux" in a["name"].lower()), assets[0])
          req = urllib.request.Request(asset["browser_download_url"], headers={"User-Agent": "Vypex-Cr_ck-CI"})
          with urllib.request.urlopen(req, timeout=180) as response:
              data = response.read()
          root = os.path.join(os.environ["RUNNER_TEMP"], "openorbis")
          os.makedirs(root, exist_ok=True)
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              archive.extractall(root)
          candidates = []
          for current, dirs, files in os.walk(root):
              if "link.x" in files and "crt1.o" in files:
                  candidates.append(current)
          if not candidates:
              raise SystemExit("Downloaded release did not contain the expected OpenOrbis link.x and lib/crt1.o files.")
          toolchain = candidates[0]
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write("OO_PS4_TOOLCHAIN=" + toolchain + "\n")
              env.write("PATH=" + os.path.join(toolchain, "bin", "linux") + ":" + os.environ["PATH"] + "\n")
          print("Using toolchain at", toolchain)
          print("Release asset:", asset["name"])
          PY
      - name: Compile native PS4 ELF
        run: bash scripts/build-ps4.sh build
      - name: Verify target ELF
        run: |
          file build/Vypex-Cr_ck.elf
          readelf -h build/Vypex-Cr_ck.elf
      - name: Upload PS4 ELF
        uses: actions/upload-artifact@v4
        with:
          name: Vypex-Cr_ck-PS4-ELF
          path: build/Vypex-Cr_ck.elf
          if-no-files-found: error
          retention-days: 30
