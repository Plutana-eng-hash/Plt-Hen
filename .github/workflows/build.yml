name: Build Plt-Hen native, PRX, and payload
on:
  push:
    branches: [main, payload-bin-14.02]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: plt-hen-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  host-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and run core tests
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -Iinclude src/core.cpp tests/core_tests.cpp -o core-tests
          ./core-tests
  ps4-builds:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build utilities
        run: sudo apt-get update && sudo apt-get install -y curl tar file binutils clang lld llvm make
      - name: Download OpenOrbis toolchain
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/openorbis"
          mkdir -p "$root"
          curl --fail --location --retry 3 --retry-delay 2 \
            https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz \
            -o "$RUNNER_TEMP/openorbis-toolchain.tar.gz"
          tar -xzf "$RUNNER_TEMP/openorbis-toolchain.tar.gz" -C "$root"
          sdk=""
          while IFS= read -r linker_script; do
            candidate="$(dirname "$linker_script")"
            if [[ -f "$candidate/lib/crt1.o" && -d "$candidate/include" ]]; then sdk="$candidate"; break; fi
          done < <(find "$root" -type f -name link.x -print)
          [[ -n "$sdk" ]] || { echo "OpenOrbis SDK root not found" >&2; exit 1; }
          echo "OO_PS4_TOOLCHAIN=$sdk" >> "$GITHUB_ENV"
      - name: Download GoldHEN Plugin SDK
        run: |
          git clone --depth 1 https://github.com/GoldHEN/GoldHEN_Plugins_SDK.git "$RUNNER_TEMP/GoldHEN_Plugins_SDK"
          echo "GOLDHEN_SDK=$RUNNER_TEMP/GoldHEN_Plugins_SDK" >> "$GITHUB_ENV"
      - name: Build native ELF
        run: bash scripts/build-ps4.sh build
      - name: Build GoldHEN PRX
        run: bash scripts/build-prx.sh build-prx
      - name: Verify existing outputs
        run: |
          file build/Vypex-Cr_ck.elf
          test -s build-prx/out/Vypex-Cr_ck.prx
          file build-prx/out/Vypex-Cr_ck.prx
          readelf -h build-prx/Vypex-Cr_ck.prx.elf
      - name: Upload native ELF and PRX
        uses: actions/upload-artifact@v4
        with:
          name: Plt-Hen-ELF-and-PRX
          path: |
            build/Vypex-Cr_ck.elf
            build-prx/out/Vypex-Cr_ck.prx
          if-no-files-found: error
          retention-days: 30
  payload-bin:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build standalone 14.02 payload
        uses: iHaiDeeZ/ps4-payload-sdk@main
        with:
          app_path: payload
          build_command: make clean all
      - name: Verify raw payload
        run: |
          test -s payload/Plutana-HEN.bin
          file payload/Plutana-HEN.bin
          python3 - <<'PY'
          from pathlib import Path
          p = Path("payload/Plutana-HEN.bin")
          data = p.read_bytes()
          if len(data) < 256:
              raise SystemExit("payload is unexpectedly small")
          if data[:4] == b"\x7fELF":
              raise SystemExit("output is ELF, not a raw payload")
          print(f"Raw payload verified: {len(data)} bytes")
          PY
      - name: Upload raw PS4 payload
        uses: actions/upload-artifact@v4
        with:
          name: Plutana-HEN-PS4-14.02-BIN
          path: payload/Plutana-HEN.bin
          if-no-files-found: error
          retention-days: 30
